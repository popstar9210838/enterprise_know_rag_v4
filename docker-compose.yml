services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-app
    container_name: rag-backend
    restart: unless-stopped
    volumes:
      - rag-chroma:/app/chroma_db
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./server:/app/server:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - EMBEDDING_DEVICE=cpu
      - MONITORING_LOG_LEVEL=${MONITORING_LOG_LEVEL:-INFO}
      - MONITORING_LOG_FORMAT=${MONITORING_LOG_FORMAT:-text}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/chunks')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-final
      args:
        VITE_API_BASE: /api
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  rag-chroma:
