server {
    listen 80;
    server_name _;

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Frontend static assets (fingerprinted → aggressive cache) ──
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API & Files → proxy to backend ──
    location ~ ^/(query|query/stream|sample-questions|preview|build|rebuild|ingest|upload|index|chunks|files) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for /query/stream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── Root: serve SPA index.html ──
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── SPA fallback: all other paths → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
