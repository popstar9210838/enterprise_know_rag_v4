services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    volumes:
      - rag-chroma:/app/chroma_db
      - ./data:/app/data
      - rag-model-cache:/app/model_cache
      - ./config.yaml:/app/config.yaml:ro
      # Dev bind mounts — changes take effect on restart, no rebuild needed
      - ./server:/app/server:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - EMBEDDING_DEVICE=cpu
      - MONITORING_LOG_LEVEL=${MONITORING_LOG_LEVEL:-INFO}
      - MONITORING_LOG_FORMAT=${MONITORING_LOG_FORMAT:-text}
      - UVICORN_RELOAD=${UVICORN_RELOAD:-0}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/chunks')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  frontend:
    image: nginx:alpine
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  rag-chroma:
  rag-model-cache:
